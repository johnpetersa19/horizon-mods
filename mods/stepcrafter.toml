game = "26.3"
file = "stepcrafter.hmod"
sha256 = "60f93e175ec3122f602058f5bdd851f90438cb2a57683d1bb902727878b17010"
changelog = """This version gives the crafter the configuration panel it was missing: until now it could only be told what to make through chat, while its requester already had a panel of its own. The panel shows the machine's own slots and adds a cell that takes a carried item as the target, with step buttons for the band that refuse to invert it. The block's template did not need to change, and the reason is worth recording: this port opens the menu from its own click handler and draws the panel itself, so the class-dependent opener another port needed does not apply here. Proven in game: a machine nobody has opened reads no target and no band; a right click opens the panel with the machine's twenty-seven slots intact; a carried torch makes the target and the machine reads two cells and four out; sixteen presses of max and eight of min give a band of eight to sixteen; a press that would invert the band is refused; and the band values are clamped so a very large number cannot wrap on the wire. The older requester panel, the queue and the take path all still pass."""

[[versions]]
version = "0.2.7"
published = "2026-11-23"
game = "26.3"
file = "stepcrafter.hmod"
sha256 = "968321fd7ef5c64b9825fbe4eb87a1b0c4910512cab89f1d5ebe27f225c24bbc"
changelog = """This version gives the crafter a work queue, so two requesters asking the same machine for different things each get their own share instead of one anonymous count. The reference's shape backs it — every request becomes a task with its own remaining amount, and a failed task belongs to the requester that asked. The queue is ordered by requester position and then by item, so two askers in the same tick cannot race for the head; the head is spent one step per tick and credited to its own asker; a refused ask keeps its place and only its asker reports the refusal and times out. Proven in game on exactly that: after forty ticks the first requester reads four served and one queued while the second reads zero served and one queued, and after a two-step restock the first reads eight and the second four, with the crafter naming both asks and the single serve beside them. The older single-ask field is dropped on write because it is operational state — the asker simply re-asks."""

[[versions]]
version = "0.2.6"
published = "2026-11-23"
game = "26.3"
file = "stepcrafter.hmod"
sha256 = "6463ca1d05de67a3a2d6d890a76658b672e98aad82b655ff7b65479c4ea251b9"
changelog = """This version gives the requester a screen, so a player edits its filter entries by clicking rather than by typing commands, and the screen and the command write the same saved container. The surface was measured before anything was written: a menu declared as a menu type in the package's data, a screen part that draws cells and numbers, button presses for stepping an amount, and data slots that are a view of the saved compound rather than a second source of truth. Proven in game: a right-click opens the container, a carried torch clicked onto a cell becomes an entry with its band, raising the minimum past the maximum is refused, clicking a second carried item repoints the cell and keeps the band, the screen's remove button drops the entry, a command adding an entry shows up as two, and a requester that was never opened reads zero. Four traps cost runs and are recorded: the engine opens a mod container's menu for nobody so the machine must ask, the menu field must name a declared menu type, a panel taller than the screen is clipped and its clicks land elsewhere, and the harness numbers slots from the hotbar.
"""

