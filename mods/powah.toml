file = "powah.hmod"
sha256 = "41c3456e743ad4cf85d68812a086532f1afc0429cb0c1033f1bbcc415f90a225"
changelog = """This version finishes the side config, the last half of the machine control gap: each face now stores its own transfer type rather than a boolean, with the four types and their order read from the reference. The defaults are not uniform and are carried as the jar has them — cells, hoppers, transmitters and ender machines start at all on every face, while furnators, solar panels and dischargers start at extract, and the orb and cable have no side config at all. Proven on a cell whose north face was set to none: the sink stayed at zero across twenty ticks while the south face delivered exactly five hundred energy a tick, the two stores conserved to a round million, and flipping the face back resumed charging. The full replay reached this slice with every earlier phase green, then false-failed on a harness regex that demanded a space before the comma-separated fields; that run was discarded and the verdict came from bounded legs."""

[[versions]]
version = "0.2.15"
published = "2026-11-24"
game = "26.3"
file = "powah.hmod"
sha256 = "f954aa9099f1ab550176602d406c1a71cba78fde765f881a65c75e58206cbd40"
changelog = """This version finishes the comparator family: the energizing orb now answers with the number of non-empty stacks in its seven slots, capped at fifteen, and a rod answers with its own buffer fraction, which the machine already computed. A cable still answers nothing because it stores nothing, and giving it a signal would only have made the family look complete. The orb's reading is a count, not a charge fraction, which is the part a generic implementation would have got wrong. Proven at the wire rather than at a block, because a comparator has no block entity here: three blaze powder in the orb reads three, a full rod reads fifteen, a half-full rod reads seven, and a cable beside a full chest reads nothing while the chest itself reads one. The inverted orb assertion fails at the count it should have produced, so the leg cannot pass vacuously."""

[[versions]]
version = "0.2.14"
published = "2026-11-23"
game = "26.3"
file = "powah.hmod"
sha256 = "c6f1e813acea2b4891f40eebfc1e49e5ee889449715458206939234fb53f0ac2"
changelog = """This version makes a comparator read a machine's own charge instead of the container behind it. Eight kinds answer it, which is exactly the eight that already print a comparator figure, and the ones that store nothing stay silent rather than reporting zero for the wrong reason. Two things in the brief were simply wrong and the game settled both: a comparator has no block entity here, so its output is read at the redstone wire the game itself drives rather than queried from the block, and a cell half full reads seven rather than eight, because the fraction is taken of fifteen and truncated. Proven at three charges with the wire in front: half full reads seven, full reads fifteen, a quarter reads three, and each change is announced to the neighbours rather than waiting for a read. The differentials are the ones that matter: a stone reads nothing, and a cable beside a full chest reads nothing while a comparator on that same chest reads one."""

[[versions]]
version = "0.2.13"
published = "2026-11-23"
game = "26.3"
file = "powah.hmod"
sha256 = "70f218d63974277c44b1d98fe6fd2a90b3fb131e45ecc212972ff532e3d9cf04"
changelog = """This version gives every machine that has one a redstone mode: ignore the signal, which is the default, or run only while powered, or run only while unpowered. The reference's set is exactly those three and it is followed machine by machine rather than applied wholesale — eleven machines honour it and each gates the same thing the reference gates, so a cable refuses an insertion while a discharger's own item drain stops but its side extraction keeps running. The mode is saved where the reference saves it and not where it does not, so a broken machine's item carries its buffer and never its mode. Proven in game on all three modes and both polarities: a shut gate charges nothing over twenty ticks, the same rig charges again once the block is removed, ignoring the signal charges while the block is still there, and the powered and unpowered cases each behave as their own rule says. Five runs each caught a real defect, and they are recorded rather than smoothed over: a command word that was accepted but sent differently, a clamp that ran before the test item arrived, a foreign block answering a mode it has no field for, a shared channel that made a starter cell look wrong, and a pickup platform that had gone missing."""

