file = "powah.hmod"
sha256 = "8b264c5d2e9a3da6073c9dc17229cd474d625ed63aabb56d6900922df5be951a"
changelog = """This version adds the player transmitter and the binding card, so a machine can charge a player's inventory rather than a block beside it. The card is bound by using it, and the transmitter reads the name back and charges the bound player's items through their own energy handler at the tier's rate. Proven in game on the numbers: a card used from the hand binds to the operator and the transmitter names them; ten thousand in the buffer goes onto a cell item in that player's inventory and the transmitter reads exactly zero; a hundred thousand spends exactly five hundred a tick measured on the game clock, with the item gaining whole steps that add up against the same window; a blank card charges nothing and spends nothing; the nitro tier clamps two billion and names a million a tick. The slice also fixes a defect that predates it: a cable network rotated its starting port, so two storages on one cable ping-ponged the same charge and never equalized, which had also been making an older test pass or fail on which parity the harness happened to read."""

[[versions]]
version = "0.2.11"
published = "2026-11-23"
game = "26.3"
file = "powah.hmod"
sha256 = "49ba3462341a8460bd020a5e5816113a974be3fee78555d226eab4923b71612f"
changelog = """This version adds the ender cell and the ender gate in all seven tiers, which are not storage blocks at all: the energy lives in a world-level store keyed by owner and channel, so every block on one channel is the same battery and a fill into one is a fill into all. That is why a broken cell carries nothing on its item and a relaunch loses nothing, which is the opposite of every storage block this port has built so far and is the reason the leg checks it by moving one cell to another channel and reading its peer unchanged. Proven in game on the numbers: two cells on one channel both read a hundred thousand and name their own tier's transfer, the moved cell reads zero on its new channel while its peer stays exactly where it was and finds the energy again when moved back, an extender gives the channel its own capacity, and a gate feeds only the face it faces at the cable's rate while the hopper behind it stays empty. One arithmetic error of my own was caught by the red: an expectation of four million and one against a value of four thousand and one, and the expectation was corrected rather than the code.
"""

