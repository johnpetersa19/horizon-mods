changelog = """This version consults the deny tag the reference ships, so a block the mod says must not be built is refused when it is selected and when it is a destination. The tag is carried byte for byte as the jar ships it: four blocks and three tags that resolve to forty-five in this build. The interesting part is that with the shipped tag the destination rule is invisible, because every one of those forty-five is already non-replaceable here, so a count built on the tag alone could not fail. The leg therefore extends the tag in a test world with a block that is replaceable and shows the count fall from eight to six, and it records the deviation plainly: the reference reads the tag at the selection only, and applying it to destinations is the exchange gadget's rule borrowed into this path. Selection is proved separately, with a block that only the tag can refuse. The build modes stay held and the preview stays blocked, neither re-attempted."""

