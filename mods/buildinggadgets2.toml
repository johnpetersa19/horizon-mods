changelog = """This version gives the exchange gadget a destination plan, the other consumer of the deny tag the earlier slice carried. Two of the brief's names were wrong and the artefact settled both: the shipped item is gadget_exchanging, while GadgetExchanger is the Java class, and the plan's rules come from the reference's isExchangingValid and isValidBlockState rather than a generic layer copy. Proven on the counts that can fail: with a piston head and bedrock in the planned layer only one cell is eligible; with two ordinary stones three are; nothing is placed or removed in either case because the write stays held. The older destruction plan and both deny-tag legs remain green, and the inverted assertion fails at the count it should have produced. The render-block line stays blocked because this build has no block-class query."""

