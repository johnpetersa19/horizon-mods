changelog = """This version gives the Copy Paste gadget its Copy-mode plan: it now reports which cells would be copied without copying them, placing nothing and removing nothing, in the same held shape as the destruction and exchange plans. The shipped item is gadget_copy_paste, which is what the jar calls it; the Java class name and the shortened name in the brief appear in no jar file, and the difference is recorded. The plan keeps the three reference rules the pin can query — air, unbreakable by destroy speed and the deny tag — with the render-block line still blocked, and reuses the shared layer planner rather than a fourth implementation. Proven on the count pair: a piston head and bedrock in the layer leave one eligible cell, two ordinary stones leave three, and every earlier plan stays green in the same leg while the inverted assertion swaps both counts and fails."""

