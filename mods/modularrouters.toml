sha256 = "52e4ebe3fc95a163ae5a815b38cffd25c61b5b36c40675d683c04742cc45c621"
changelog = """Slice 4, the Speed and Stack upgrades and the router's five upgrade slots: two rules the port already computed and tested — items per operation and ticks per operation — were unreachable, because nothing could put an upgrade on a router. Now they can, with the reference's own per-slot limits of nine speed and six stack and the five-slot cap, and a foreign upgrade id carried verbatim exactly as a foreign module is. Proven in game with a differential router beside each case: a Stack upgrade makes every sampled operation move two items where the un-upgraded router moves one, four Speed upgrades in one slot take the interval from twenty ticks to twelve, and a tick-exact window reads sixty stone against eighteen over three hundred and sixty ticks. Removing an upgrade hands the item back and the interval returns to twenty, a doctored save with forty-five speed reads one item every two ticks and refuses a further add because the slots are full, and a tagged gunpowder answers that it is an upgrade this build does not install. Two intermediate failures are kept as evidence because each names a platform fact rather than a port bug: replacing a chest to empty it is refused at this pin, so a window that relied on that counted cumulative items, and the no-upgrade reply names the item id.
"""

