file = "modularrouters.hmod"
sha256 = "c584f8ebbf5c46fc1bd318bac89bb0ec507206a1e96ee02acb01354accb64d98"
changelog = """This version adds the breaker module, which takes a block in front of the router and moves its drops into the buffer. Its rules come from the reference and several are easy to flatten wrongly: an empty amount means unlimited, otherwise the buffer must be below the regulator amount; a stick is a stone-tier tool and cannot take diamond ore, while an iron pickaxe can; glass breaks with no drops under the default blacklist but not under a non-empty whitelist; and a block filter tests the block item while an item filter tests the drops, so the two behave differently on the same stone. Proven across ten rigs covering each of those cases, with a fresh in-game red on the shipped previous package where the module id was unknown. The harvest-tier tag is written from the tool the module carries rather than guessed."""

[[versions]]
version = "0.2.15"
published = "2026-11-23"
game = "26.3"
file = "modularrouters.hmod"
sha256 = "dd7db49377876fd14d18f2abeca0e9d78b72bf460105ede8a96e9f93c4bf3805"
changelog = """This version adds the placer module, which puts the router's buffer into the block beside it and stops once that block is occupied. One thing the brief had wrong is worth stating because the machine is right and the brief was not: a placer has exactly one destination, so eight stone cannot mean eight placements — the first one fills the block, every later attempt finds it occupied and takes nothing, and the buffer stays at seven. That is the reference's rule and it is what the game shows. Proven in nine rigs whose differences are the claims: a front-facing placer places one and keeps seven, a direction of none places nothing, a stick has no block form and places nothing, a whitelist naming dirt moves nothing, a pre-filled destination changes nothing, an upward placer fills the block above, and a regulator of three places only when the buffer is above three. The two augment rules the port had unit-tested but marked blocked are now shown in game: the module refuses a stack augment outright and accepts exactly one regulator, and the recipe crafts with its ingredients consumed."""

[[versions]]
version = "0.2.14"
published = "2026-11-23"
game = "26.3"
file = "modularrouters.hmod"
sha256 = "5f5bc461a58c94e3829a17f68dfc80c9c7789f7f54b576c9643566cf21e57e5d"
changelog = """This version adds the flinger module, which throws the router's buffer along an aim the player sets: speed, pitch and yaw, with the reference's own geometry and its rule that one field out of range resets all three. The operation, filter and count are the dropper's, already proved, because the reference's flinger extends it and overrides only the velocity. Proven in game with six rigs whose differences are the claims: a throw at speed one puts all eight past the adjacent block while the same module at speed zero leaves them in it, an upward facing throws them above the router, a pitch of ninety on a horizontal aim throws them beside it, a yaw of sixty throws them out of the row, and a whitelist naming dirt throws nothing. It also answers a performance review on the vacuum: the buffer's room is checked before any dropped item is resolved, inspection is capped at sixty-four candidates, and the read stops once the budget is filled — proved by counted unit tests rather than by a stopwatch, because this harness cannot isolate one operation's resolutions from the twenty-tick cadence."""

[[versions]]
version = "0.2.13"
published = "2026-11-23"
game = "26.3"
file = "modularrouters.hmod"
sha256 = "c7972fcd89193953e23351e030f569347d14bcdc0df261292924735115a34bad"
changelog = """This version adds the vacuum module, and it is the port's first slice that reads and writes the world's dropped items rather than a container. The rule is the reference's and it is stricter than the obvious one: the box is a cube around the router, a pick-up delay skips an item, and the module only takes what matches the item the router already holds, because the reference compares the buffer's own stack rather than accepting the first entity it finds. Proven in game with five rigs whose differences are the claims: eight stone inside the reach end up in the buffer with nothing left on the ground, a whitelist naming dirt takes nothing, the same module one block past its six-block reach takes nothing, a router already holding dirt takes no stone, and a regulator set to three stops the buffer at three with five still lying there. The first two rigs are one block apart at the reach boundary, which is what makes the reach a measurement rather than a description. One defect in the reference is fixed rather than copied: it reads a stale buffer stack, so with more than one item per operation the amount can be exceeded. The API this needed was measured before it was used, including that a write during a tick is staged and a rejected tick restores both the ground stack and its removal."""

